version: '3.8'

# =============================================================================
# Real Estate ERP — Cloud SaaS Deployment
# Host: realestater.grozai.net
# Usage: docker compose -f docker-compose.cloud.yml --env-file .env up -d
# =============================================================================

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-re_erp}
      POSTGRES_USER: ${DB_USER:-erp_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-erp_user}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: always
    deploy:
      resources:
        limits:
          memory: ${PG_MEM_LIMIT:-512M}
          cpus: '2.0'
    networks:
      - internal

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory ${REDIS_MAXMEM:-64mb} --maxmemory-policy allkeys-lru --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: always
    deploy:
      resources:
        limits:
          memory: ${REDIS_MEM_LIMIT:-128M}
          cpus: '0.5'
    networks:
      - internal

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 5s
      retries: 5
    restart: always
    deploy:
      resources:
        limits:
          memory: ${MINIO_MEM_LIMIT:-256M}
          cpus: '0.5'
    networks:
      - internal

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-re_erp}
      DB_USER: ${DB_USER:-erp_user}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SSL: "false"
      DB_POOL_SIZE: ${DB_POOL_SIZE:-30}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_EXPIRY: ${JWT_EXPIRY:-900}
      JWT_REFRESH_EXPIRY: ${JWT_REFRESH_EXPIRY:-604800}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-erp-documents}
      S3_REGION: us-east-1
      CORS_ORIGINS: ${CORS_ORIGINS:-https://property.grozai.net}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@grozai.net}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    deploy:
      resources:
        limits:
          memory: ${API_MEM_LIMIT:-512M}
          cpus: '1.0'
      replicas: ${API_REPLICAS:-1}
    networks:
      - internal

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    command: ["node", "dist/worker.js"]
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-re_erp}
      DB_USER: ${DB_USER:-erp_user}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-erp-documents}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    deploy:
      resources:
        limits:
          memory: ${WORKER_MEM_LIMIT:-256M}
          cpus: '0.5'
      replicas: ${WORKER_REPLICAS:-1}
    networks:
      - internal

  # Caddy reverse proxy with automatic HTTPS
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - web
    restart: always
    networks:
      - internal

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    depends_on:
      - api
    restart: always
    deploy:
      resources:
        limits:
          memory: ${WEB_MEM_LIMIT:-128M}
          cpus: '0.25'
    networks:
      - internal

  # Automated daily database backups
  db-backup:
    image: postgres:16-alpine
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${DB_NAME:-re_erp}
      PGUSER: ${DB_USER:-erp_user}
      PGPASSWORD: ${DB_PASSWORD}
    volumes:
      - ./backups:/backups
    entrypoint: /bin/sh
    command: >
      -c "while true; do
        FILENAME=/backups/erp_backup_$$(date +%Y%m%d_%H%M%S).sql.gz;
        pg_dump | gzip > $$FILENAME;
        echo \"Backup created: $$FILENAME\";
        find /backups -name '*.sql.gz' -mtime +30 -delete;
        sleep 21600;
      done"
    depends_on:
      postgres:
        condition: service_healthy
    restart: always
    networks:
      - internal

  # Monitoring
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheusdata:/prometheus
    restart: always
    networks:
      - internal
    profiles:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_SERVER_ROOT_URL: https://property.grozai.net/grafana
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      - grafanadata:/var/lib/grafana
    depends_on:
      - prometheus
    restart: always
    networks:
      - internal
    profiles:
      - monitoring

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
  miniodata:
    driver: local
  caddydata:
    driver: local
  caddyconfig:
    driver: local
  prometheusdata:
    driver: local
  grafanadata:
    driver: local

networks:
  internal:
    driver: bridge
